# The workspace root is also the app: `cargo run` opens the synth with its
# panel. The library crates it is built from live in `crates/`.
[package]
name = "bevy_synth_app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The bevy_synth control panel as a runnable app."

[[bin]]
name = "bevy_synth"
path = "src/main.rs"

[dependencies]
bevy_synth = { path = "crates/bevy_synth" }
bevy_synth_ui = { path = "crates/bevy_synth_ui" }

# The app needs a real window, so unlike the library crates it pulls the full
# engine. A game that already has a window pays none of this.
bevy = "0.19"
bevy_egui = "0.42"

[workspace]
resolver = "2"
members = [
    "crates/synth_core",
    "crates/synth_audio",
    "crates/bevy_synth",
    "crates/bevy_synth_ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

# DSP must be fast even in debug builds, or the audio thread underruns.
[profile.dev.package.synth_core]
opt-level = 3

# Dependencies too: a debug build of Bevy's renderer is slow enough that the
# frame time starves the audio callback. Built once, then cached.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
